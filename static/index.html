<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agentic BPM · WP1</title>
<link rel="stylesheet" href="/static/vendor/bpmn-js.css"><style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--muted:#5d6675;--line:#e3e6eb;--acc:#2a78d6;--chip:#eef2fb}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui;background:var(--bg);color:var(--ink)}header{padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:center}h1{font-size:18px;margin:0}.wrap{display:grid;grid-template-columns:220px 1fr 290px;min-height:calc(100vh - 52px)}nav,aside{background:var(--panel);padding:12px;border-right:1px solid var(--line)}nav button{display:block;text-align:left;width:100%;border:0;background:transparent;padding:10px;cursor:pointer;border-radius:8px}nav button.on{background:var(--chip);font-weight:bold}main{padding:20px;min-width:0}h2{margin-top:0}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}input,select,button{font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px}button{cursor:pointer;background:var(--panel)}button.pri{background:var(--acc);color:white}pre{font:12px/1.5 monospace;white-space:pre-wrap;overflow:auto;max-height:500px}.muted{color:var(--muted)}.tag{background:var(--chip);padding:3px 8px;border-radius:6px;font-size:12px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:7px;text-align:left;border-bottom:1px solid var(--line)}.scroll{overflow:auto;max-height:500px}#viewer{height:420px}.kpi{display:flex;gap:12px;flex-wrap:wrap}.kpi div{flex:1;min-width:130px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.kpi b{display:block;font-size:24px}.error{color:#c4372f}aside{border-left:1px solid var(--line)}a{color:var(--acc)}@media(max-width:1100px){.wrap{grid-template-columns:1fr}nav{display:flex;overflow:auto}nav button{min-width:160px}aside{display:none}}
</style></head><body><header><h1>Agentic BPM Testbed</h1><span class="tag">Work Package 1 · real Camunda · L0 rules</span><span id="status" class="muted"></span></header>
<div class="wrap"><nav id="nav"></nav><main><div class="card"><div class="row">
<div><label>Dataset</label><select id="dataset"><option>bpic2019</option><option>bpic2017</option><option>synthetic</option></select></div>
<div><label>Scenario</label><select id="scenario"></select></div><div><label>Strategy</label><select id="strategy"><option value="full">Full L0 rule set</option><option value="none">No adaptation</option><option value="retry">Retry only</option><option value="retry_fallback">Retry + fallback</option><option value="escalate">Escalate everything</option></select></div>
<div><label>Seed</label><input id="seed" type="number" value="42" style="width:85px"></div><div><label>Instances</label><input id="instances" type="number" value="200" min="1" max="10000" style="width:90px"></div>
<button class="pri" id="execute">Run experiment</button><button id="compare">Compare five strategies</button></div><p class="muted" id="notice">Camunda executes BPMN. Python workers execute mock-system jobs. Batch human approvals are synthetic.</p></div>
<div id="content"></div></main><aside><b>Experiment configuration</b><pre id="config"></pre><b>Selected run</b><select id="runs" style="width:100%"></select><pre id="summary"></pre></aside></div>
<script src="/static/vendor/bpmn-viewer.development.js"></script><script src="/static/app.js"></script></body></html>
