<html lang="en">
<head>

<title>Adaptation Testbed v1</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--muted:#5d6675;--line:#e3e6eb;--acc:#2a78d6;--chip:#eef2fb;
 --ok:#1e8e5a;--warn:#b26f00;--bad:#c4372f;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--base:#a3a7ae;--grid:#e9ebef;--shade:rgba(196,55,47,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--panel:#1c2027;--ink:#e6e8ec;--muted:#a3abb8;--line:#2c323c;--acc:#3987e5;--chip:#232a38;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--base:#5f6672;--grid:#2a2f38;--shade:rgba(230,103,103,.10)}}
:root[data-theme="dark"]{--bg:#14171c;--panel:#1c2027;--ink:#e6e8ec;--muted:#a3abb8;--line:#2c323c;--acc:#3987e5;--chip:#232a38;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--base:#5f6672;--grid:#2a2f38;--shade:rgba(230,103,103,.10)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:3}
header h1{font-size:16px;margin:0}header .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;text-decoration:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.wrap{display:grid;grid-template-columns:220px 1fr 290px;min-height:calc(100vh - 53px)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:8px}
nav a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);cursor:pointer;white-space:nowrap}
nav a .n{width:20px;height:20px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:11px;flex:none}
nav a.on{background:var(--chip);font-weight:600}
nav .grp{font-size:11px;text-transform:uppercase;color:var(--muted);margin:12px 10px 4px}
main{padding:16px 20px;overflow:auto;min-width:0}
aside{border-left:1px solid var(--line);background:var(--panel);padding:12px;overflow:auto}
aside pre{font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:0;color:var(--muted)}
h2{font-size:18px;margin:0 0 4px}p.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;min-width:0}
.card h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot{font-size:10px;background:var(--chip);color:var(--acc);padding:2px 6px;border-radius:6px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{display:block;font-size:12px;color:var(--muted);margin:6px 0 2px}
select,input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:500}.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{overflow:auto}
.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--chip);white-space:nowrap}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}
.feed{height:260px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--muted)}
.note{border-left:3px solid var(--warn);padding:8px 12px;background:var(--chip);border-radius:6px;font-size:13px;margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.sq{height:10px;width:10px;border-radius:2px}
svg{display:block;max-width:100%}svg text{fill:var(--muted);font-size:11px;font-family:system-ui,sans-serif}svg text.ink{fill:var(--ink)}
#tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:none;z-index:9;max-width:280px}
pre.code{font:11px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:260px;overflow:auto;white-space:pre-wrap}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav .grp{display:none}aside{border-left:0;border-top:1px solid var(--line)}.grid2,.grid3{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>Adaptation Testbed</h1><span class="tag">v1 · environment + rule-based (L0) adaptation · no provenance · synthetic</span>
  <span class="sp"></span>
  <a class="btn" href="v2-provenance.html">→ v2: agents + provenance</a>
  <button class="btn pri" onclick="go('compare');compareAll()">▶ Compare L0 strategies</button>
</header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main>
<aside><h3 style="margin:0 0 8px;font-size:13px">experiment.yaml</h3><pre id="yaml"></pre></aside></div>
<div id="tip"></div>
<script>
"use strict";
// =============================================================== configuration (mirrors the YAML the real testbed reads)
const ENV={camunda:"8.x (pinned)",client:"REST API",seed:42,days:3,arrival_per_hour:6,clerks:3,reviewers:2,sla_hours:48,sla_warn_ratio:.75,
 retry_max:3,retry_backoff_min:10,human_delay_min:60};
const ATTR={new_customer_rate:.25,amount_mu:8.4,amount_sigma:.7,regions:"north,south,east,west",missing_addr_rate:.06};
// disruption scenarios: windows are in hours from start
const SCEN=[
 {id:"pay_outage",label:"Payment service outage",type:"service outage",on:true,from:10,to:16,param:"fail_prob",val:1,oracle:"fallback | escalate | retry (only if it succeeds)"},
 {id:"credit_timeout",label:"Credit-check timeout",type:"timeout",on:true,from:30,to:34,param:"timeout_prob",val:.7,oracle:"retry | fallback (manual review) | escalate"},
 {id:"missing_addr",label:"Missing shipping address",type:"missing data",on:true,from:0,to:72,param:"rate",val:.06,oracle:"CRM lookup | ask customer (escalate)"},
 {id:"clerk_out",label:"Warehouse clerks unavailable",type:"resource",on:true,from:40,to:52,param:"clerks_left",val:1,oracle:"reassign staff"},
 {id:"sla_risk",label:"SLA risk (75% of SLA elapsed)",type:"SLA risk",on:true,from:0,to:999,param:"-",val:0,oracle:"prioritise | expedite"},
 {id:"compliance",label:"New rule: compliance check for amount > 10k",type:"tactical rule change",on:true,from:36,to:999,param:"amount_gt",val:10000,oracle:"insert compliance step"}];
// rule-based (L0) handler: one configurable strategy per request type
const HSLOTS={
 service_error:{title:"Service error (payment / credit check)",m:{none:"no handling (incident)",retry:"retry",retry_fallback:"retry → fallback service",retry_fallback_escalate:"retry → fallback → escalate",escalate:"escalate to human"}},
 missing_data:{title:"Missing data",m:{none:"no handling (incident)",lookup:"CRM lookup",lookup_escalate:"CRM lookup → ask customer",escalate:"ask customer (escalate)"}},
 resource:{title:"Resource shortage",m:{wait:"wait in queue",reassign:"reassign staff from other team"}},
 sla:{title:"SLA risk",m:{none:"no action",prioritise:"prioritise in queues",expedite:"prioritise + expedited shipping"}},
 rule_change:{title:"Tactical rule change",m:{static:"static rules (unaware)",update_lag:"rules updated after lag"}}};
let H={service_error:"retry_fallback_escalate",missing_data:"lookup_escalate",resource:"reassign",sla:"prioritise",rule_change:"update_lag",rule_lag_h:12};
const PRESETS={
 p0:{label:"No adaptation",h:{service_error:"none",missing_data:"none",resource:"wait",sla:"none",rule_change:"static",rule_lag_h:12}},
 p1:{label:"Retry only",h:{service_error:"retry",missing_data:"none",resource:"wait",sla:"none",rule_change:"static",rule_lag_h:12}},
 p2:{label:"Retry + fallback",h:{service_error:"retry_fallback",missing_data:"lookup",resource:"wait",sla:"none",rule_change:"static",rule_lag_h:12}},
 p3:{label:"Full L0 rule set",h:{service_error:"retry_fallback_escalate",missing_data:"lookup_escalate",resource:"reassign",sla:"prioritise",rule_change:"update_lag",rule_lag_h:12}},
 p4:{label:"Escalate everything",h:{service_error:"escalate",missing_data:"escalate",resource:"reassign",sla:"prioritise",rule_change:"update_lag",rule_lag_h:12}}};

// =============================================================== process model (BPMN, order-to-cash)
const NODES=[
 {id:"validate",label:"Validate order",kind:"service",mean:5},
 {id:"credit",label:"Credit check",kind:"service",mean:3,sub:"DMN"},
 {id:"review",label:"Manual review",kind:"user",mean:90,res:"reviewers"},
 {id:"reserve",label:"Reserve stock",kind:"service",mean:4},
 {id:"payment",label:"Payment",kind:"service",mean:2},
 {id:"compliance",label:"Compliance check",kind:"service",mean:30},
 {id:"pick",label:"Pick & pack",kind:"user",mean:45,res:"clerks"},
 {id:"ship",label:"Ship",kind:"service",mean:10,sub:"+ carrier msg"},
 {id:"invoice",label:"Invoice",kind:"service",mean:3}];

// =============================================================== RNG, heap, hash
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return("0000000"+(h>>>0).toString(16)).slice(-8)}
class Heap{constructor(){this.a=[];this.k=0}push(t,f){const a=this.a;a.push({t,f,k:this.k++});let i=a.length-1;while(i>0){const p=(i-1)>>1;if(this.lt(a[i],a[p])){[a[i],a[p]]=[a[p],a[i]];i=p}else break}}
 lt(x,y){return x.t<y.t||(x.t===y.t&&x.k<y.k)}pop(){const a=this.a,top=a[0],l=a.pop();if(a.length){a[0]=l;let i=0;for(;;){let m=i;const L=2*i+1,R=L+1;if(L<a.length&&this.lt(a[L],a[m]))m=L;if(R<a.length&&this.lt(a[R],a[m]))m=R;if(m===i)break;[a[i],a[m]]=[a[m],a[i]];i=m}}return top}get size(){return this.a.length}}

// =============================================================== discrete-event simulation of the testbed
function simulate(h){
 const r=mulberry32(+ENV.seed),ra=mulberry32(+ENV.seed+1);   // ra: case attributes / arrivals (identical across handlers)
 const exp=m=>-Math.log(1-r())*m;
 const sc=id=>SCEN.find(s=>s.id===id&&s.on);
 const inWin=(s,t)=>s&&t>=s.from*60&&t<s.to*60;
 const Q=new Heap(),log=[],reqs=[],cases=[];let now=0;
 const pool={clerks:{cap:+ENV.clerks,busy:0,q:[]},reviewers:{cap:+ENV.reviewers,busy:0,q:[]}};
 const ev=(c,act,life,extra)=>log.push(Object.assign({case:c.id,activity:act,lifecycle:life,t:now,resource:"",disruption:"",intervention:""},extra||{}));
 const req=(c,type,label,action,match)=>{reqs.push({t:now,case:c.id,type,label,action,match});ev(c,"adaptation:"+type,"complete",{disruption:label,intervention:action,resource:"L0-handler"})};
 // arrivals
 const horizon=+ENV.days*24*60;let t=0;let n=0;const regions=String(ATTR.regions).split(",");
 while(true){t+=-Math.log(1-ra())*60/+ENV.arrival_per_hour;if(t>horizon)break;
  const amount=Math.round(Math.exp(+ATTR.amount_mu+ +ATTR.amount_sigma*Math.sqrt(-2*Math.log(1-ra()))*Math.cos(2*Math.PI*ra())));
  const c={id:"C-"+(1000+n++),arr:t,amount,newCust:ra()<+ATTR.new_customer_rate,region:regions[Math.floor(ra()*regions.length)],missingAddr:ra()<(sc("missing_addr")?+sc("missing_addr").val:0),
   done:null,status:"running",prio:false,slaWarned:false,cost:0,human:0,needsCompliance:false,didCompliance:false,adapt:[]};
  cases.push(c);Q.push(t,()=>start(c))}
 const comp=sc("compliance"),ruleKnownAt=comp?(h.rule_change==="update_lag"?comp.from*60+(+h.rule_lag_h)*60:Infinity):Infinity;
 function start(c){ev(c,"Order received","complete",{resource:"msg"});go(c,"validate")}
 function finish(c,status){c.status=status;c.done=now;if(status==="stuck")c.stuckAt=now;ev(c,status==="completed"?"Order closed":status==="rejected"?"Order rejected":"Incident (stuck)","complete")}
 function next(c,id){const order=["validate","credit","review","reserve","payment","compliance","pick","ship","invoice"];
  let i=order.indexOf(id)+1;
  for(;i<order.length;i++){const n=order[i];
   if(n==="review"&&c.dmn!=="review")continue;
   if(n==="compliance"){c.needsCompliance=comp&&now>=comp.from*60&&c.amount>+comp.val;if(!(c.needsCompliance&&now>=ruleKnownAt))continue;}
   return go(c,n)}
  if(c.needsCompliance&&!c.didCompliance)c.violation=true;finish(c,"completed")}
 function go(c,id){const N=NODES.find(x=>x.id===id);
  if(N.res)return acquire(c,N);
  ev(c,N.label,"start",{resource:"worker:"+id});const d=exp(N.mean);Q.push(now+d,()=>serviceDone(c,N,0))}
 function acquire(c,N){const p=pool[N.res];const cap=capOf(N.res);if(p.busy<cap){p.busy++;ev(c,N.label,"start",{resource:N.res});Q.push(now+exp(N.mean),()=>{p.busy--;ev(c,N.label,"complete",{resource:N.res});release(N.res);after(c,N)})}
  else{c.prio?p.q.unshift({c,N}):p.q.push({c,N});
   const s=sc("clerk_out");if(N.res==="clerks"&&inWin(s,now)&&!c.resReq){c.resReq=true;const a=h.resource;req(c,"resource",s.label,a,a==="reassign")}}}
 function capOf(res){if(res==="clerks"){const s=sc("clerk_out");if(inWin(s,now))return h.resource==="reassign"?+s.val+1:+s.val;return +ENV.clerks}return +ENV.reviewers}
 function release(res){const p=pool[res];while(p.q.length&&p.busy<capOf(res)){const{c,N}=p.q.shift();acquire(c,N)}}
 function after(c,N){if(N.id==="compliance")c.didCompliance=true;
  if(N.id==="ship"){const wait=exp(c.expedite?60:240);Q.push(now+wait,()=>{ev(c,"Carrier pickup confirmed","complete",{resource:"msg"});next(c,"ship")});return}
  next(c,N.id)}
 function serviceDone(c,N,attempt){
  // failure modes
  let fail=null;
  if(N.id==="payment"){const s=sc("pay_outage");if(inWin(s,now)&&r()<+s.val)fail={type:"service_error",label:s.label}}
  if(N.id==="credit"){const s=sc("credit_timeout");if(inWin(s,now)&&r()<+s.val)fail={type:"service_error",label:s.label}}
  if(N.id==="validate"&&c.missingAddr&&!c.addrFixed)fail={type:"missing_data",label:"Missing shipping address"};
  if(!fail){ev(c,N.label,"complete",{resource:"worker:"+N.id});
   if(c._pending&&attempt>0){const t0=now;now=c._pending.t;req(c,"service_error",c._pending.label,"retry succeeded",true);now=t0;c._pending=null}
   if(N.id==="credit"){c.dmn=c.amount>20000?"reject":(c.amount>8000||c.newCust)?"review":"approve";ev(c,"DMN: "+c.dmn,"complete",{resource:"dmn"});if(c.dmn==="reject")return finish(c,"rejected")}
   return after(c,N)}
  ev(c,N.label,"error",{resource:"worker:"+N.id,disruption:fail.label});
  if(fail.type==="service_error")return handleService(c,N,attempt,fail);
  return handleMissing(c,N,fail)}
 function handleService(c,N,attempt,fail){const s=h.service_error;
  const canRetry=(s==="retry"||s==="retry_fallback"||s==="retry_fallback_escalate")&&attempt<+ENV.retry_max;
  if(canRetry){Q.push(now+(+ENV.retry_backoff_min)*(attempt+1),()=>{ev(c,N.label,"start",{resource:"worker:"+N.id,intervention:"retry "+(attempt+1)});Q.push(now+exp(N.mean),()=>serviceDone(c,N,attempt+1))});
   if(attempt===0)c._pending={type:"service_error",label:fail.label,t:now};return}
  const rec=(action,match)=>{const p=c._pending||{label:fail.label};const t0=now;now=p.t||now;req(c,"service_error",p.label,action,match);now=t0;c._pending=null};
  if(s==="retry_fallback"||s==="retry_fallback_escalate"){
   if(N.id==="payment"){rec("fallback: backup PSP",true);c.cost+=1;ev(c,N.label+" (backup PSP)","complete",{resource:"backup-psp",intervention:"fallback"});return after(c,N)}
   if(N.id==="credit"){rec("fallback: manual review",true);c.dmn="review";ev(c,N.label,"complete",{intervention:"fallback→manual review"});return after(c,N)}}
  if(s==="escalate"||s==="retry_fallback_escalate"){rec("escalate to human",true);c.human++;Q.push(now+exp(+ENV.human_delay_min),()=>{ev(c,N.label+" (human)","complete",{resource:"ops-human",intervention:"escalated"});if(N.id==="credit"){c.dmn=c.amount>8000?"review":"approve"}after(c,N)});return}
  rec(s==="none"?"none":"retries exhausted",false);finish(c,"stuck")}
 function handleMissing(c,N,fail){const s=h.missing_data;
  if(s==="lookup"||s==="lookup_escalate"){if(r()<.7){req(c,"missing_data",fail.label,"CRM lookup",true);c.addrFixed=true;Q.push(now+5,()=>serviceDone(c,N,0));return}
   if(s==="lookup"){req(c,"missing_data",fail.label,"CRM lookup failed",false);return finish(c,"stuck")}}
  if(s==="escalate"||s==="lookup_escalate"){req(c,"missing_data",fail.label,"ask customer (escalate)",true);c.human++;c.addrFixed=true;Q.push(now+exp(240),()=>serviceDone(c,N,0));return}
  req(c,"missing_data",fail.label,"none",false);finish(c,"stuck")}
 // SLA monitor
 const slaMin=+ENV.sla_hours*60;
 function slaCheck(){for(const c of cases){if(c.arr>now||c.done!=null||c.slaWarned)continue;if(now-c.arr>=slaMin*+ENV.sla_warn_ratio&&sc("sla_risk")){c.slaWarned=true;const a=h.sla;req(c,"sla",sc("sla_risk").label,a,a!=="none");if(a!=="none")c.prio=true;if(a==="expedite"){c.expedite=true;c.cost+=2}}}
  if(Q.size)Q.push(now+30,slaCheck)}
 Q.push(30,slaCheck);
 // compliance rule change becomes a request when it starts (one per run)
 if(comp)Q.push(comp.from*60,()=>{reqs.push({t:now,case:"(all)",type:"rule_change",label:comp.label,action:h.rule_change==="update_lag"?"rules updated after "+h.rule_lag_h+"h":"static rules",match:h.rule_change==="update_lag"})});
 // main loop with retry-success bookkeeping
 const MAXT=horizon+10*24*60;
 while(Q.size){const e=Q.pop();if(e.t>MAXT)break;now=e.t;e.f()}
 for(const c of cases){if(c._pending){req(c,"service_error",c._pending.label,"retry succeeded",true);c._pending=null}
  if(c.done==null){c.status="stuck";c.done=now}}
 // metrics
 const fin=cases.filter(c=>c.status==="completed"),N=cases.length;
 const ct=fin.map(c=>(c.done-c.arr)/60);
 const sla=cases.filter(c=>c.status==="stuck"||(c.status!=="rejected"&&(c.done-c.arr)>slaMin)).length;  // stuck cases never meet the SLA
 const viol=cases.filter(c=>c.violation).length,stuck=cases.filter(c=>c.status==="stuck").length;
 const adReq=reqs.filter(q=>q.type!=="rule_change");
 const m={N,completed:fin.length,rejected:cases.filter(c=>c.status==="rejected").length,stuck,
  completionPct:100*(N-stuck)/N,meanCT:ct.reduce((a,b)=>a+b,0)/Math.max(ct.length,1),slaPct:100*sla/N,violations:viol,
  human:cases.reduce((a,c)=>a+c.human,0),cost:cases.reduce((a,c)=>a+c.cost,0),requests:adReq.length,oraclePct:100*adReq.filter(q=>q.match).length/Math.max(adReq.length,1)};
 // WIP series (hourly)
 const hours=Math.ceil(Math.max(...cases.map(c=>c.done))/60)+1,wip=[];
 for(let k=0;k<Math.min(hours,24*8);k++){const tt=k*60;wip.push(cases.filter(c=>c.arr<=tt&&(c.status==="stuck"||c.done>tt)).length)}
 reqs.sort((a,b)=>a.t-b.t);
 log.sort((a,b)=>a.t-b.t);
 return{m,log,reqs,cases,wip}}

// =============================================================== XES / CSV
const iso=min=>new Date(Date.UTC(2026,9,12,8,0,0)+min*60000).toISOString();
function toXES(res){const by={};for(const e of res.log)(by[e.case]=by[e.case]||[]).push(e);
 const x=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
 let o=`<?xml version="1.0" encoding="UTF-8"?>\n<log xes.version="1.0" xmlns="http://www.xes-standard.org/">\n <extension name="Concept" prefix="concept" uri="http://www.xes-standard.org/concept.xesext"/>\n <extension name="Time" prefix="time" uri="http://www.xes-standard.org/time.xesext"/>\n <extension name="Lifecycle" prefix="lifecycle" uri="http://www.xes-standard.org/lifecycle.xesext"/>\n <extension name="Organizational" prefix="org" uri="http://www.xes-standard.org/org.xesext"/>\n <string key="run:id" value="${runMeta().run_id}"/>\n`;
 for(const[c,evs]of Object.entries(by)){const cs=res.cases.find(k=>k.id===c);o+=` <trace>\n  <string key="concept:name" value="${c}"/>\n`+(cs?`  <float key="amount" value="${cs.amount}"/>\n  <string key="region" value="${cs.region}"/>\n`:"");
  for(const e of evs)o+=`  <event><string key="concept:name" value="${x(e.activity)}"/><string key="lifecycle:transition" value="${e.lifecycle}"/><date key="time:timestamp" value="${iso(e.t)}"/><string key="org:resource" value="${x(e.resource)}"/>${e.disruption?`<string key="disruption" value="${x(e.disruption)}"/>`:""}${e.intervention?`<string key="intervention" value="${x(e.intervention)}"/>`:""}</event>\n`;
  o+=` </trace>\n`}
 return o+"</log>\n"}
function toCSV(res){let s="case_id,activity,lifecycle,timestamp,resource,disruption,intervention\n";for(const e of res.log)s+=[e.case,e.activity,e.lifecycle,iso(e.t),e.resource,e.disruption,e.intervention].map(v=>/[,"]/.test(v)?`"${String(v).replace(/"/g,'""')}"`:v).join(",")+"\n";return s}
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}

function cfgObj(){return{env:ENV,case_attributes:ATTR,scenarios:SCEN.filter(s=>s.on).map(({id,from,to,param,val})=>({id,from_h:from,to_h:to,[param]:val})),handler:H}}
function runMeta(){const c=JSON.stringify(cfgObj());return{run_id:"run-"+fnv(c+"|"+ENV.seed),seed:ENV.seed,config_hash:fnv(c),versions:{testbed:"v1-prototype",camunda:ENV.camunda,client:ENV.client,simulator:"in-browser DES"}}}
function yaml(){const o=cfgObj();let y=`# ${runMeta().run_id}  config_hash=${runMeta().config_hash}\nenv:\n`;for(const[k,v]of Object.entries(o.env))y+=`  ${k}: ${v}\n`;
 y+="case_attributes:\n";for(const[k,v]of Object.entries(o.case_attributes))y+=`  ${k}: ${v}\n`;
 y+="scenarios:\n";for(const s of o.scenarios){y+=`  - id: ${s.id}\n`;for(const[k,v]of Object.entries(s))if(k!=="id")y+=`    ${k}: ${v}\n`}
 y+="handler:  # L0 rule-based\n";for(const[k,v]of Object.entries(o.handler))y+=`  ${k}: ${v}\n`;document.getElementById("yaml").textContent=y}

const tip=document.getElementById("tip");
document.addEventListener("mousemove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el){tip.innerHTML=el.getAttribute("data-tip");tip.style.display="block";tip.style.left=Math.min(e.clientX+12,innerWidth-290)+"px";tip.style.top=(e.clientY+12)+"px"}else if(!e.target.closest||!e.target.closest(".xhair"))tip.style.display="none"});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function stepNice(v){const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function nice(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}
function hbar(rows,key,title,fmt,lowerBetter,hi){const W=420,lw=150,rh=24,H=rows.length*rh+30,dm=Math.max(...rows.map(r=>r.m[key]),1e-9),max=4*stepNice(dm/4);const sc=v=>(W-lw-50)*v/max;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">`;
 for(let k=0;k<=4;k++){const x=lw+sc(max*k/4);s+=`<line x1="${x}" x2="${x}" y1="4" y2="${H-22}" stroke="var(--grid)"/><text x="${x}" y="${H-8}" text-anchor="middle">${fmt(max*k/4,true)}</text>`}
 rows.forEach((r,i)=>{const y=6+i*rh,v=r.m[key],w=Math.max(sc(v)-4,0);
  s+=`<text x="${lw-8}" y="${y+14}" text-anchor="end" class="ink">${esc(r.label)}</text><g data-tip="<b>${esc(r.label)}</b><br>${esc(title)}: ${fmt(v)}"><rect x="${lw}" y="${y}" width="${W-lw}" height="${rh}" fill="transparent"/>`+
   `<path d="M${lw},${y+4} h${w} a4,4 0 0 1 4,4 v6 a4,4 0 0 1 -4,4 h-${w} z" fill="${r.k===hi?"var(--s1)":"var(--base)"}"/></g><text x="${lw+sc(v)+6}" y="${y+14}" class="ink">${fmt(v)}</text>`});
 return s+`</svg><div style="font-size:11px;color:var(--muted)">${lowerBetter?"lower is better":"higher is better"}</div>`}
function wipChart(rs){const N=Math.max(...rs.map(r=>r.res.wip.length));rs.forEach(r=>{while(r.res.wip.length<N)r.res.wip.push(r.res.wip[r.res.wip.length-1])});const W=680,H=280,l=40,b=30,t=12,rt=150;const my=nice(Math.max(...rs.flatMap(r=>r.res.wip)));
 const X=i=>l+(W-l-rt)*i/(N-1),Y=v=>H-b-(H-b-t)*v/my;let s=`<svg class="xhair" id="wipSvg" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Work in progress over time">`;
 SCEN.filter(x=>x.on&&x.to-x.from<48).forEach((sc,k)=>{const x0=X(sc.from),x1=X(Math.min(sc.to,N-1));s+=`<rect x="${x0}" y="${t}" width="${x1-x0}" height="${H-b-t}" fill="var(--shade)"/><text x="${x0+3}" y="${t+10+k*12}" style="font-size:10px">${esc(sc.type)}</text>`});
 for(let k=0;k<=4;k++)s+=`<line x1="${l}" x2="${W-rt}" y1="${Y(my*k/4)}" y2="${Y(my*k/4)}" stroke="var(--grid)"/><text x="${l-6}" y="${Y(my*k/4)+4}" text-anchor="end">${Math.round(my*k/4)}</text>`;
 for(let d=0;d*24<N;d++)s+=`<text x="${X(d*24)}" y="${H-b+16}" text-anchor="${d?"middle":"start"}">day ${d}</text>`;
 const ends=[];rs.forEach(r=>{let d="";r.res.wip.forEach((v,i)=>d+=(d?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1));s+=`<path d="${d}" fill="none" stroke="${r.col}" stroke-width="2" stroke-linejoin="round"/>`;
  const pk=Math.max(...r.res.wip);ends.push({y:Y(r.res.wip[N-1]),r,pk})});
 ends.sort((a,b)=>a.y-b.y);let last=-99;ends.forEach(e=>{const y=Math.max(e.y,last+16);last=y;s+=`<text x="${W-rt+6}" y="${y+4}" class="ink">${esc(e.r.label)} · ${e.r.res.wip[N-1]}</text>`});
 s+=`<line id="wx" y1="${t}" y2="${H-b}" stroke="var(--muted)" visibility="hidden"/></svg>`;
 setTimeout(()=>{const svg=document.getElementById("wipSvg");if(!svg)return;svg.onmousemove=e=>{const bb=svg.getBoundingClientRect(),px=(e.clientX-bb.left)*W/bb.width;const i=Math.max(0,Math.min(N-1,Math.round((px-l)/(W-l-rt)*(N-1))));
  const xh=svg.querySelector("#wx");xh.setAttribute("x1",X(i));xh.setAttribute("x2",X(i));xh.setAttribute("visibility","visible");
  tip.innerHTML=`<b>hour ${i}</b> (cases in system)<br>`+rs.map(r=>`<span style="color:${r.col}">■</span> ${esc(r.label)}: ${r.res.wip[i]??"–"}`).join("<br>");tip.style.display="block";tip.style.left=Math.min(e.clientX+12,innerWidth-290)+"px";tip.style.top=(e.clientY+12)+"px"};
  svg.onmouseleave=()=>{tip.style.display="none";svg.querySelector("#wx").setAttribute("visibility","hidden")}},0);
 return s}
function bpmn(counts){const pos={validate:[70,40],credit:[175,40],review:[175,130],reserve:[280,40],payment:[385,40],compliance:[385,130],pick:[490,40],ship:[595,40],invoice:[700,40]};
 let s=`<svg viewBox="0 0 820 200" width="100%" role="img" aria-label="Order-to-cash BPMN"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="var(--muted)"/></marker></defs><g stroke="var(--muted)" fill="none">

${["validate","credit","reserve","payment","pick","ship"].map((k,i,a)=>i<a.length-1?`<line x1="${pos[k][0]+88}" y1="63" x2="${pos[a[i+1]][0]-2}" y2="63" marker-end="url(#ar)"/>`:"").join("")}
<line x1="683" y1="63" x2="698" y2="63" marker-end="url(#ar)"/><line x1="788" y1="63" x2="800" y2="63"/><circle cx="808" cy="63" r="9" stroke-width="3"/>
<path d="M219 86 V130" marker-end="url(#ar)" stroke-dasharray="3 3"/><path d="M263 153 H300 V88" marker-end="url(#ar)" stroke-dasharray="3 3"/>
<path d="M429 86 V130" marker-end="url(#ar)" stroke-dasharray="3 3"/><path d="M473 153 H510 V88" marker-end="url(#ar)" stroke-dasharray="3 3"/></g>`;
 for(const N of NODES){const[x,y]=pos[N.id],c=counts&&counts[N.id]||{};const err=c.error>0;
  s+=`<g data-tip="<b>${esc(N.label)}</b> (${N.kind} task${N.res?", "+N.res:""})<br>completed: ${c.complete||0}<br>errors: ${c.error||0}${c.active!=null?"<br>active now: "+c.active:""}"><rect x="${x}" y="${y}" width="88" height="46" rx="8" fill="var(--panel)" stroke="${err?"var(--bad)":"var(--muted)"}" stroke-width="${err?2:1}"/>`+

 s+=`<text x="219" y="125" text-anchor="end" style="font-size:10px">DMN=review</text><text x="429" y="125" text-anchor="end" style="font-size:10px">rule: >10k</text><circle cx="429" cy="86" r="6" fill="var(--panel)" stroke="var(--bad)"/><text x="440" y="100" style="font-size:10px">error</text><circle cx="70" cy="40" r="6" fill="var(--panel)" stroke="var(--warn)"/><text x="40" y="30" style="font-size:10px">SLA timer</text></svg>`;
 return s}

${res.log.slice(0,300).map(e=>`<tr><td>${e.case}</td><td>${esc(e.activity)}</td><td>${e.lifecycle}</td><td style="white-space:nowrap">${iso(e.t).slice(0,16).replace("T"," ")}</td><td>${esc(e.resource)}</td><td>${esc(e.disruption)}</td><td>${esc(e.intervention)}</td></tr>`).join("")}</table></div></div>`},
compare:()=>`<h2>Compare & Charts · L0 strategies</h2><p class="sub">The five handler presets on the same seeded cases and disruptions (seed ${ENV.seed}). Blue = "Full L0 rule set", the baseline that LLM agents must beat in v2.</p>
<div class="note">Numbers follow from the simulator's assumptions; they show what the testbed measures, not empirical results.</div><div id="charts"><div class="card"><button class="btn pri" onclick="compareAll()">▶ Compare L0 strategies</button></div></div>`};
function counts(res){const c={};for(const e of res.log){const N=NODES.find(n=>e.activity.startsWith(n.label));if(!N)continue;const o=c[N.id]=c[N.id]||{complete:0,error:0};if(e.lifecycle=="complete")o.complete++;if(e.lifecycle=="error")o.error++}return c}
function sampleCases(){const res=simulate(PRESETS.p0.h);return `<div class="tblwrap"><table class="tbl"><tr><th>case</th><th>arrival</th><th class="num">amount</th><th>new customer</th><th>region</th><th>address</th></tr>${res.cases.slice(0,8).map(c=>`<tr><td>${c.id}</td><td>${iso(c.arr).slice(11,16)}</td><td class="num">${c.amount.toLocaleString("en")}</td><td>${c.newCust?"yes":""}</td><td>${c.region}</td><td>${c.missingAddr?"missing":"ok"}</td></tr>`).join("")}</table></div><p class="sub" style="margin:6px 0 0">${res.cases.length} cases over ${ENV.days} days.</p>`}

// ---- run replay
let tmr=null,spd=1,hr=0;
function play(){if(!LAST)LAST=simulate(H);stopPlay();if(hr===0){document.getElementById("feed").innerHTML="";document.getElementById("rq").innerHTML=""}
 const maxH=Math.ceil(Math.max(...LAST.cases.map(c=>c.done))/60);tmr=setInterval(()=>{if(page!=="run"||hr>maxH){stopPlay();return}tickHour(hr++)},200/spd)}
function stopPlay(){clearInterval(tmr);tmr=null}
function tickHour(h){const t0=h*60,t1=t0+60,res=LAST;const set=(i,v)=>{const e=document.getElementById(i);if(e)e.textContent=v};
 const evs=res.log.filter(e=>e.t>=t0&&e.t<t1),rq=res.reqs.filter(q=>q.t>=t0&&q.t<t1);const f=document.getElementById("feed"),r=document.getElementById("rq");
 for(const e of evs.slice(-14))f.insertAdjacentHTML("afterbegin",`<div>${iso(e.t).slice(11,16)} ${e.case} ${esc(e.activity)} <span class="tag ${e.lifecycle=="error"?"bad":""}">${e.lifecycle}</span></div>`);
 for(const q of rq)r.insertAdjacentHTML("afterbegin",`<div>${iso(q.t).slice(5,16).replace("T"," ")} ${q.case} <b>${esc(q.label)}</b> → ${esc(q.action)} <span class="tag ${q.match?"ok":"bad"}">${q.match?"oracle ✓":"oracle ✗"}</span></div>`);
 set("clock","t = "+h+" h · day "+Math.floor(h/24));set("k1",res.cases.filter(c=>c.arr<t1).length);set("k2",res.cases.filter(c=>c.done<t1&&c.status!=="stuck").length);set("k3",res.reqs.filter(q=>q.t<t1&&q.type!=="rule_change").length);set("k4",res.cases.filter(c=>c.status==="stuck"&&c.done<t1).length);
 const c={};for(const e of res.log){if(e.t>=t1)break;const N=NODES.find(n=>e.activity.startsWith(n.label));if(!N)continue;const o=c[N.id]=c[N.id]||{complete:0,error:0,active:0};if(e.lifecycle=="complete")o.complete++;if(e.lifecycle=="error")o.error++}
 const b=document.getElementById("bpmnLive");if(b)b.innerHTML=bpmn(c)}

// ---- comparison
function compareAll(){const save=Object.assign({},H);const cols={p0:"var(--s2)",p1:"var(--s3)",p2:"var(--s4)",p3:"var(--s1)",p4:"var(--s5)"};
 const rs=Object.entries(PRESETS).map(([k,p])=>({k,label:p.label,col:cols[k],res:simulate(p.h)})).map(x=>Object.assign(x,{m:x.res.m}));Object.assign(H,save);CMP=rs;
 const el=document.getElementById("charts");if(!el)return;const fp=(v,ax)=>ax?Math.round(v)+"%":v.toFixed(1)+"%",fi=v=>Math.round(v)+"",fh=(v,ax)=>ax?Math.round(v)+"h":v.toFixed(1)+" h";
 const best=rs.find(r=>r.k=="p3");
 el.innerHTML=`<div class="kpi"><div><b>${best.m.completionPct.toFixed(1)}%</b><span>completed or correctly rejected · Full L0</span></div><div><b>${best.m.slaPct.toFixed(1)}%</b><span>SLA breaches · Full L0</span></div><div><b>${best.m.oraclePct.toFixed(0)}%</b><span>responses matching the oracle · Full L0</span></div><div><b>${best.m.violations}</b><span>compliance violations · Full L0</span></div></div>
<div class="grid2"><div class="card"><h3>Cases not stuck</h3>${hbar(rs,"completionPct","Cases completed or rejected",fp,false,"p3")}</div>
<div class="card"><h3>Responses matching the oracle</h3>${hbar(rs,"oraclePct","Oracle match",fp,false,"p3")}</div>
<div class="card"><h3>SLA breaches</h3>${hbar(rs,"slaPct","SLA breached",fp,true,"p3")}</div>
<div class="card"><h3>Mean cycle time (completed cases)</h3>${hbar(rs,"meanCT","Mean cycle time",fh,true,"p3")}</div>
<div class="card"><h3>Compliance violations (tactical rule)</h3>${hbar(rs,"violations","Violations",fi,true,"p3")}</div>
<div class="card"><h3>Human escalations</h3>${hbar(rs,"human","Human escalations",fi,true,"p3")}</div></div>
<div class="card"><h3>Cases in the system over time</h3><div class="legend">${rs.map(r=>`<span><i style="background:${r.col}"></i>${r.label}</span>`).join("")}<span><i class="sq" style="background:var(--shade);border:1px solid var(--bad)"></i>disruption window</span></div>${wipChart(rs)}
<p class="sub" style="margin:6px 0 0">Stuck cases never leave the system, so curves without adaptation keep rising after each disruption window.</p></div>
<div class="card"><h3>Table view</h3><div class="tblwrap"><table class="tbl"><tr><th>Strategy</th><th class="num">Cases</th><th class="num">Stuck</th><th class="num">Not stuck %</th><th class="num">SLA breach %</th><th class="num">Mean CT (h)</th><th class="num">Violations</th><th class="num">Human</th><th class="num">Extra cost</th><th class="num">Oracle %</th></tr>
${rs.map(r=>`<tr><td>${r.label}</td><td class="num">${r.m.N}</td><td class="num">${r.m.stuck}</td><td class="num">${r.m.completionPct.toFixed(1)}</td><td class="num">${r.m.slaPct.toFixed(1)}</td><td class="num">${r.m.meanCT.toFixed(1)}</td><td class="num">${r.m.violations}</td><td class="num">${r.m.human}</td><td class="num">${r.m.cost}</td><td class="num">${r.m.oraclePct.toFixed(1)}</td></tr>`).join("")}</table></div>
<div class="row" style="margin-top:8px"><button class="btn" onclick="dl('l0-comparison-seed${ENV.seed}.csv',cmpCSV(),'text/csv')">Download CSV</button></div></div>`}
function cmpCSV(){let s="strategy,cases,stuck,not_stuck_pct,sla_breach_pct,mean_ct_h,violations,human,extra_cost,oracle_pct\n";for(const r of CMP)s+=[r.k,r.m.N,r.m.stuck,r.m.completionPct.toFixed(2),r.m.slaPct.toFixed(2),r.m.meanCT.toFixed(2),r.m.violations,r.m.human,r.m.cost,r.m.oraclePct.toFixed(2)].join(",")+"\n";return s}

function render(){stopPlay();hr=0;nav();document.getElementById("main").innerHTML=V[page]();yaml();if(page=="compare"&&CMP)compareAll()}
render();
</script>
</body>
</html>
